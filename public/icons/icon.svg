<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="pumpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#27272a" stroke-width="4"/>

  <!-- Live Pulse Beacon Top Right -->
  <circle cx="410" cy="102" r="28" fill="#ef4444" opacity="0.3" filter="url(#glow)"/>
  <circle cx="410" cy="102" r="16" fill="#ef4444"/>
  <circle cx="410" cy="102" r="7" fill="#ffffff"/>

  <!-- Gas Pump Body -->
  <g transform="translate(64, 76)">
    <!-- Main Pump Housing -->
    <rect x="76" y="80" width="180" height="250" rx="24" fill="#27272a" stroke="#3f3f46" stroke-width="8"/>
    
    <!-- Fuel Meter Screen -->
    <rect x="106" y="116" width="120" height="74" rx="12" fill="#09090b" stroke="#10b981" stroke-width="4"/>
    <!-- Digital meter readout bars -->
    <rect x="122" y="136" width="60" height="8" rx="4" fill="#10b981"/>
    <rect x="122" y="154" width="88" height="12" rx="4" fill="#34d399"/>
    <circle cx="196" cy="140" r="4" fill="#10b981"/>

    <!-- Pump Base Plate -->
    <rect x="52" y="322" width="228" height="24" rx="10" fill="#3f3f46"/>

    <!-- Fuel Hose & Nozzle -->
    <!-- Hose -->
    <path d="M 256 160 C 310 160, 316 260, 276 300 C 260 316, 230 316, 216 300" 
          fill="none" stroke="#71717a" stroke-width="16" stroke-linecap="round"/>
    
    <!-- Nozzle Handle -->
    <path d="M 284 120 L 256 160 L 244 150 L 268 112 Z" fill="#10b981"/>
    <path d="M 284 120 L 306 96 L 316 106 L 294 130 Z" fill="#34d399"/>
    <!-- Spout -->
    <path d="M 306 96 L 324 82 L 320 74" fill="none" stroke="#e4e4e7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Brand Label Badge -->
  <rect x="146" y="408" width="220" height="42" rx="12" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
  <text x="256" y="435" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    LIVE SPBU
  </text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Dark Zinc Canvas Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="60%" stop-color="#0f0f12"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <!-- Emerald Fuel Gradient -->
    <linearGradient id="iconEmeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect width="512" height="512" rx="116" fill="url(#bgGradient)"/>
  <rect x="8" y="8" width="496" height="496" rx="108" fill="none" stroke="#27272a" stroke-width="4"/>
  <rect x="16" y="16" width="480" height="480" rx="100" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- Subtle Concentric Telemetry Beacon Rings -->
  <g opacity="0.2" stroke="#10b981" fill="none" stroke-linecap="round">
    <circle cx="256" cy="226" r="92" stroke-width="2.5" stroke-dasharray="14 10" />
    <circle cx="256" cy="226" r="148" stroke-width="2" stroke-dasharray="20 12" />
  </g>

  <!-- Live Status Signal Pill (Top Right) -->
  <g transform="translate(372, 48)">
    <rect width="84" height="32" rx="16" fill="#09090b" stroke="#27272a" stroke-width="2"/>
    <circle cx="20" cy="16" r="5" fill="#10b981"/>
    <circle cx="20" cy="16" r="2.5" fill="#ffffff"/>
    <text x="38" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#f4f4f5" letter-spacing="1.5">LIVE</text>
  </g>

  <!-- Centerpiece: Minimalist Fuel Location Pin -->
  <g transform="translate(256, 226) scale(11.5) translate(-16, -16)">
    <!-- Fuel Location Pin compound path: outer pin + inner droplet cutout -->
    <path
      fill-rule="evenodd"
      clip-rule="evenodd"
      d="M16 2.5C10.2 2.5 5.5 7.2 5.5 13C5.5 19.8 14.1 28.2 15.3 29.3C15.7 29.7 16.3 29.7 16.7 29.3C17.9 28.2 26.5 19.8 26.5 13C26.5 7.2 21.8 2.5 16 2.5ZM16 7.5C16 7.5 11 13 11 15.8C11 18.6 13.2 20.8 16 20.8C18.8 20.8 21 18.6 21 15.8C21 13 16 7.5 16 7.5Z"
      fill="url(#iconEmeraldGrad)"
    />

    <!-- Realtime Telemetry Beacon Core -->
    <circle cx="16" cy="16.2" r="2.2" fill="#34d399" />
  </g>

  <!-- Bottom Brand Wordmark Container -->
  <g transform="translate(256, 428)">
    <rect x="-140" y="-28" width="280" height="46" rx="23" fill="#18181b" stroke="#27272a" stroke-width="2"/>
    <text y="-2" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
      <tspan font-size="19" font-weight="900" fill="#ffffff" letter-spacing="2">LIVE SPBU </tspan>
      <tspan font-size="19" font-weight="900" fill="#10b981" letter-spacing="2">BALI</tspan>
    </text>
    <text y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#a1a1aa" letter-spacing="3">
      LIVEBALI.MY.ID
    </text>
  </g>
</svg>
